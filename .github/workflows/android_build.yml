name: Android CI Build

# Определяем, когда запускать этот рабочий процесс
on:
  push:
    branches: [ main, master ] # Запускать при пуше в ветки main или master
  pull_request:
    branches: [ main, master ] # Запускать при создании Pull Request

# Определяем задания (job)
jobs:
  build:
    # Запускать на чистой виртуальной машине Ubuntu
    runs-on: ubuntu-latest

    # Шаги, которые нужно выполнить
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17' # Убедитесь, что это правильная версия для вашего проекта

      - name: 📥 Grant Execute Permission for Gradle
        run: chmod +x gradlew

      - name: 🔨 Build Debug APK
        # Запускаем задачу Gradle для сборки отладочного APK
        # Это то же самое, что вы бы запустили локально
        run: ./gradlew assembleDebug

      - name: 📦 Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          # Путь может немного отличаться в зависимости от конфигурации вашего модуля